services:
  cuda-lab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cuda_systems_lab
    ports:
      - "3000:3000"
    volumes:
      # Mount host repository to persist student work, progress, and solutions
      - .:/workspace
      - /workspace/book/node_modules
      - /workspace/book/.next
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_ENV=development
    # GPU Passthrough (Optional):
    # To run with NVIDIA GPU passthrough on Linux machines, use:
    #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
    # Or uncomment the block below:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped

